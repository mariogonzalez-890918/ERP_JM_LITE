<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QualityLite · ERP JM Lite</title></head><body class="jm-workspace"><header class="jm-header"><img src="/logo.svg" alt="JM"><strong>ERP JM Lite · QualityLite</strong><nav><a href="/">Inicio</a><a href="/cargas">Layouts y cargas</a></nav><span id="account"></span></header><main class="jm-content"><h1><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="2" y="3" width="20" height="14" rx="1"/><path d="M5 7h9M5 11h6M12 17v4M6 21h12M16 10l2 2 3-4"/></svg> Calidad</h1><output id="message" role="status"></output><section class="jm-panel"><form id="filters" class="jm-fields"><label>Módulo<select id="module"></select></label><label>Estado<select id="state"><option value="">Todos</option></select></label><label>Código / título<input id="search" maxlength="160"></label><label>Desde<input id="from" type="date"></label><label>Hasta<input id="to" type="date"></label><button>Consultar</button><button type="button" id="new">Nuevo</button><button type="button" id="excelExport">Excel</button><button type="button" id="pdfExport">PDF</button><button type="button" id="export">Exportar registros CSV</button></form><div class="jm-scroll"><table><thead><tr><th>Código</th><th>Título</th><th>Versión</th><th>Estado</th><th>Actualizado</th><th>Acciones</th></tr></thead><tbody id="rows"></tbody></table></div></section>
