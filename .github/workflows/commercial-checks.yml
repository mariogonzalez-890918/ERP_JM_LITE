name: Validación comercial Windows
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: commercial-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows-tests:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: python -m pip install -r requirements-dev.txt
      - name: Construir interfaz sin datos privados
        run: node sku/build-server.mjs
      - name: Comprobar JavaScript
        shell: pwsh
        run: |
          foreach ($file in Get-ChildItem sku-servidor/public -Filter *.js) {
            node --check $file.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Ejecutar pruebas aisladas
        run: python tools/test_all.py
      - name: Comprobar catálogos iniciales vacíos
        run: python -c "import json,pathlib; c=json.loads(pathlib.Path('sku-servidor/catalogos.json').read_text()); assert all(not v for v in c.values())"
