<section id="jmAdminApprovalsPanel" hidden><h3>Autorizaciones de AUXTI</h3><p class="note">Las bajas, cancelaciones y reemplazos de datos de AUXTI requieren aprobación de Sistemas. Las imágenes se administran libremente por Superadministrador y AUXTI.</p><button id="jmAdminRefresh" class="secondary">Actualizar solicitudes</button><output id="jmAdminMessage" aria-live="polite"></output><div class="scroll"><table><thead><tr><th>Fecha / estado</th><th>Operación</th><th>Solicitó</th><th>Motivo</th><th></th></tr></thead><tbody id="jmAdminRequests"></tbody></table></div></section>
<dialog id="jmAdminRequestDialog"><h2>Solicitar aprobación de Sistemas</h2><p id="jmAdminRequestSummary"></p><form id="jmAdminRequestForm"><label>Motivo de la solicitud<textarea id="jmAdminRequestReason" maxlength="1000" required rows="3"></textarea></label><div class="actions"><button id="jmAdminSend">Enviar solicitud</button><button id="jmAdminRequestCancel" type="button" class="secondary">Cancelar</button></div></form><output id="jmAdminRequestMessage"></output></dialog>
<dialog id="jmAdminReviewDialog"><h2>Revisar autorización de AUXTI</h2><div id="jmAdminReviewInfo"></div><button id="jmAdminBackupDownload" class="secondary" hidden>Descargar respaldo propuesto</button><form id="jmAdminDecisionForm"><label id="jmAdminCommentLabel">Comentario de Sistemas<textarea id="jmAdminComment" required maxlength="1000" rows="3"></textarea></label><div class="actions"><button id="jmAdminApprove">Autorizar y aplicar</button><button id="jmAdminReject" type="button" class="secondary">Rechazar</button><button id="jmAdminReviewClose" type="button" class="secondary">Cerrar</button></div></form><output id="jmAdminReviewMessage"></output></dialog>
