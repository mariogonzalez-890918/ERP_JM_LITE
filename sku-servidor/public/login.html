<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ERP JM Lite</title><style>body{font:16px system-ui;background:#f3f5f8;color:#182534;min-height:100vh;margin:0;display:grid;place-items:center}main{background:white;border-radius:18px;padding:32px;max-width:440px;width:calc(100% - 100px);box-shadow:0 12px 45px #18253418;text-align:center}img{width:140px;height:140px;object-fit:contain;background:white}h1{font-size:23px;line-height:1.4}label{text-align:left;display:grid;gap:8px;margin:18px 0}input,button{font:inherit;padding:12px;border:1px solid #c2cbd6;border-radius:7px}button{background:#173a6b;color:white;width:100%;border:0;cursor:pointer}output{display:block;color:#a02b32;margin-top:18px}p{color:#526275;font-size:14px}body{background:#f5f4ef;color:#292a28;border-top:5px solid #a52e25}main{border:1px solid #dddcd6;border-radius:8px;box-shadow:0 8px 35px #292a280c}h1{font-weight:650;letter-spacing:-.5px}button{background:#284e42;border-radius:5px;font-weight:600}input{border-color:#bdbfb9;border-radius:5px}input:focus{outline:2px solid #527e6f}</style><style id="gmp-login-theme">body{background:#edf2f6;color:#1b3046;border:0;font-family:'Segoe UI',Arial,sans-serif;border-top:6px solid #0067a5;box-sizing:border-box}main{max-width:440px;width:calc(100% - 38px);box-sizing:border-box;padding:32px 38px;border-radius:4px;border:1px solid #ced9e3;border-top:4px solid #123454;box-shadow:0 8px 30px #12345412}img{width:76px;height:76px;padding:0;background:transparent}h1{font-size:25px;color:#123454;margin:18px 0 10px}main>p{font-size:12px;color:#52677b;margin-bottom:22px;line-height:1.6}label{font-size:13px;font-weight:600;color:#284661;gap:7px}input{font-size:14px;background:#fff;border:1px solid #b9cad8;border-radius:3px;min-width:0}input:focus{outline:2px solid #0879bc;outline-offset:1px}button{background:#0067a5;color:#fff;border-radius:3px;padding:13px;font-size:14px;font-weight:600;margin-top:8px}button:hover{background:#004b7a}button:disabled{opacity:.55}output{font-size:13px;color:#b33333}output:empty{display:none}.gmp-password-visibility{display:flex;align-items:center;gap:9px;margin:8px 0 18px;font-weight:400}.gmp-password-visibility input{width:18px;height:18px;min-height:18px;margin:0;padding:0;accent-color:#0067a5}@media(max-width:450px){main{padding:25px}}
</style><main><img src="/logo.svg" alt="ERP JM Lite"><h1>ERP JM Lite</h1><p id="appLoginInfo">Versión 0.1.0-dev<br>aplicación soportada y gestionada por Ing. Mario González, mario.gonzalez@jad-ayt.com 2026</p><p>Catálogos, requisiciones y reportes en un solo lugar</p><form id="login"><label>Correo<input id="email" type="email" autocomplete="username" required></label><label>Contraseña<input id="password" type="password" autocomplete="current-password" minlength="4" maxlength="200" required></label><label class="gmp-password-visibility"><input id="mostrarPassword" type="checkbox" aria-controls="password"><span>Mostrar contraseña</span></label><button id="entrar">Iniciar sesión</button></form><output id="error" aria-live="polite"></output></main><script>document.getElementById('mostrarPassword').onchange=()=>{document.getElementById('password').type=document.getElementById('mostrarPassword').checked?'text':'password';};document.getElementById('login').onsubmit=async e=>{e.preventDefault();const button=document.getElementById('entrar');button.disabled=true;try{const res=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value,password:document.getElementById('password').value})});const data=await res.json();if(!res.ok)throw Error(data.error||'No se pudo iniciar sesión.');location.assign('/');}catch(err){document.getElementById('error').textContent=err.message;}finally{button.disabled=false;}};</script></html>
